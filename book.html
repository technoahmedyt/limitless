<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#6366f1">

<title>Bookmark Hub — Personal Link Manager</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #eef2ff;

    --bg: #f7f8fc;
    --surface: #ffffff;
    --surface-2: #f3f4f6;

    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;

    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;

    --sidebar-width: 250px;
    --header-height: 70px;

    --radius: 14px;

    --shadow-sm:
        0 1px 2px rgba(0,0,0,.04);

    --shadow-md:
        0 8px 30px rgba(0,0,0,.07);

    --shadow-lg:
        0 20px 60px rgba(0,0,0,.15);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);

    min-height: 100vh;

    -webkit-font-smoothing: antialiased;

    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
}


/* =========================================================
   DARK MODE
========================================================= */

body.dark {
    --bg: #0b1020;
    --surface: #121827;
    --surface-2: #1b2435;

    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #273247;

    --primary-light: #24245c;
}


/* =========================================================
   APP
========================================================= */

.app {
    min-height: 100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: var(--header-height);

    background: var(--surface);

    border-bottom:
        1px solid var(--border);

    display: flex;
    align-items: center;

    padding:
        0 24px;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 100;
}

.header-left {
    width: var(--sidebar-width);

    display: flex;
    align-items: center;

    gap: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 800;
    font-size: 20px;

    white-space: nowrap;
}

.brand-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    color: white;

    border-radius: 11px;

    box-shadow:
        0 5px 15px rgba(99,102,241,.25);
}

.header-center {
    flex: 1;

    max-width: 650px;

    margin: auto;
}

.global-search {
    width: 100%;

    position: relative;
}

.global-search input {
    width: 100%;

    height: 42px;

    padding:
        0 45px 0 42px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    outline: none;

    background: var(--surface-2);

    color: var(--text);

    transition: .2s;
}

.global-search input:focus {
    background: var(--surface);

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.10);
}

.search-icon {
    position: absolute;

    left: 14px;
    top: 50%;

    transform:
        translateY(-50%);

    color: var(--muted);
}

.search-shortcut {
    position: absolute;

    right: 9px;
    top: 50%;

    transform:
        translateY(-50%);

    padding: 3px 7px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 5px;

    color: var(--muted);

    font-size: 11px;
}

.header-right {
    width: var(--sidebar-width);

    display: flex;
    justify-content: flex-end;

    gap: 7px;
}

.icon-btn {
    width: 40px;
    height: 40px;

    border:
        1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    border-radius: 10px;

    display: grid;
    place-items: center;

    transition: .2s;
}

.icon-btn:hover {
    background: var(--surface-2);

    transform:
        translateY(-1px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;

    top: var(--header-height);
    left: 0;
    bottom: 0;

    width: var(--sidebar-width);

    background: var(--surface);

    border-right:
        1px solid var(--border);

    padding: 20px 13px;

    overflow-y: auto;

    z-index: 90;

    transition:
        transform .25s ease;
}

.sidebar-section {
    margin-bottom: 25px;
}

.sidebar-label {
    font-size: 10px;

    font-weight: 800;

    color: var(--muted);

    text-transform: uppercase;

    letter-spacing: .08em;

    padding:
        0 12px 9px;
}

.nav-item {
    width: 100%;

    border: none;

    background: transparent;

    color: var(--text);

    padding:
        10px 12px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 3px;

    transition: .2s;
}

.nav-item-left {
    display: flex;

    align-items: center;

    gap: 11px;
}

.nav-icon {
    width: 21px;

    text-align: center;

    font-size: 16px;
}

.nav-item:hover {
    background:
        var(--surface-2);
}

.nav-item.active {
    background:
        var(--primary-light);

    color:
        var(--primary);

    font-weight: 700;
}

.nav-count {
    font-size: 11px;

    color: var(--muted);

    background:
        var(--surface-2);

    padding:
        2px 7px;

    border-radius: 20px;
}

.nav-item.active .nav-count {
    color: var(--primary);

    background:
        rgba(99,102,241,.12);
}

.category-row {
    display: flex;
    align-items: center;
}

.category-row .nav-item {
    flex: 1;
}

.category-delete {
    opacity: 0;

    border: none;

    background: transparent;

    color: var(--muted);

    padding: 5px;
}

.category-row:hover
.category-delete {
    opacity: 1;
}

.category-delete:hover {
    color: var(--danger);
}


/* =========================================================
   MAIN
========================================================= */

.main {
    margin-left: var(--sidebar-width);

    padding-top:
        calc(var(--header-height) + 30px);

    min-height: 100vh;
}

.content {
    max-width: 1500px;

    margin: auto;

    padding:
        0 28px 50px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;
}

.page-title {
    font-size: 28px;

    font-weight: 800;

    letter-spacing: -.5px;
}

.page-description {
    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;
}

.primary-btn {
    border: none;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            #7c3aed
        );

    color: white;

    padding:
        11px 17px;

    border-radius: 10px;

    font-weight: 700;

    box-shadow:
        0 7px 18px
        rgba(99,102,241,.22);

    transition: .2s;

    white-space: nowrap;
}

.primary-btn:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(99,102,241,.28);
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;
}

.filter-left,
.filter-right {
    display: flex;

    align-items: center;

    gap: 8px;
}

.filter-btn {
    border:
        1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    padding:
        8px 12px;

    border-radius: 8px;

    font-size: 12px;

    transition: .2s;
}

.filter-btn:hover {
    background: var(--surface-2);
}

.filter-btn.active {
    background:
        var(--primary-light);

    color:
        var(--primary);

    border-color:
        transparent;

    font-weight: 700;
}

.sort-select {
    border:
        1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    padding:
        8px 11px;

    border-radius: 8px;

    outline: none;

    font-size: 12px;
}


/* =========================================================
   BOOKMARK GRID
========================================================= */

.bookmark-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(275px, 1fr)
        );

    gap: 17px;
}


/* =========================================================
   CARD
========================================================= */

.bookmark-card {
    position: relative;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    padding: 18px;

    min-height: 180px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    cursor: grab;
}

.bookmark-card:hover {
    transform:
        translateY(-4px);

    box-shadow:
        var(--shadow-md);

    border-color:
        rgba(99,102,241,.25);
}

.bookmark-card.dragging {
    opacity: .45;

    transform:
        rotate(2deg);
}


/* =========================================================
   CARD TOP
========================================================= */

.card-head {
    display: flex;

    gap: 13px;

    align-items: flex-start;
}

.site-icon {
    width: 46px;
    height: 46px;

    flex-shrink: 0;

    border-radius: 12px;

    background:
        var(--surface-2);

    display: grid;

    place-items: center;

    overflow: hidden;

    border:
        1px solid var(--border);
}

.site-icon img {
    width: 27px;
    height: 27px;

    object-fit: contain;
}

.site-fallback {
    font-size: 21px;
}

.card-info {
    min-width: 0;

    flex: 1;
}

.card-name {
    font-size: 15px;

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    padding-right: 4px;
}

.card-url {
    margin-top: 5px;

    color: var(--muted);

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.star-btn {
    border: none;

    background: transparent;

    color: #d1d5db;

    font-size: 20px;

    line-height: 1;

    padding: 1px;

    transition: .15s;
}

.star-btn:hover {
    transform:
        scale(1.15);
}

.star-btn.favorite {
    color: #f59e0b;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.card-description {
    color: var(--muted);

    font-size: 12px;

    line-height: 1.55;

    margin:
        15px 0;

    display:
        -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}


/* =========================================================
   CARD FOOTER
========================================================= */

.card-footer {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.tag {
    background:
        var(--primary-light);

    color:
        var(--primary);

    border-radius: 20px;

    padding:
        5px 9px;

    font-size: 10px;

    font-weight: 700;

    white-space: nowrap;
}

.card-actions {
    display: flex;

    gap: 5px;
}

.card-action {
    width: 31px;
    height: 31px;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color: var(--muted);

    border-radius: 8px;

    display: grid;

    place-items: center;

    font-size: 13px;

    transition: .2s;
}

.card-action:hover {
    background:
        var(--surface-2);

    color:
        var(--text);
}

.card-action.delete:hover {
    color:
        var(--danger);

    border-color:
        rgba(239,68,68,.2);

    background:
        rgba(239,68,68,.05);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    display: none;

    text-align: center;

    padding: 80px 20px;

    color: var(--muted);
}

.empty-illustration {
    width: 75px;
    height: 75px;

    display: grid;
    place-items: center;

    background:
        var(--primary-light);

    border-radius: 22px;

    margin:
        0 auto 18px;

    font-size: 32px;
}

.empty-state h3 {
    color: var(--text);

    margin-bottom: 7px;

    font-size: 18px;
}

.empty-state p {
    font-size: 13px;

    margin-bottom: 18px;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(15,23,42,.62);

    backdrop-filter:
        blur(5px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 15px;

    z-index: 500;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 540px;

    max-height: 90vh;

    overflow-y: auto;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius: 18px;

    box-shadow:
        var(--shadow-lg);

    padding: 25px;

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform:
            translateY(10px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

.modal-head {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;
}

.modal-title {
    font-size: 20px;

    font-weight: 800;
}

.close-btn {
    border: none;

    background:
        var(--surface-2);

    color: var(--muted);

    width: 34px;
    height: 34px;

    border-radius: 8px;
}

.close-btn:hover {
    color: var(--text);
}

.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;

    font-size: 12px;

    font-weight: 750;

    margin-bottom: 7px;
}

.form-control {
    width: 100%;

    padding:
        12px 13px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    outline: none;

    background:
        var(--surface);

    color:
        var(--text);

    transition: .2s;
}

.form-control:focus {
    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.1);
}

textarea.form-control {
    min-height: 85px;

    resize: vertical;
}

.modal-footer {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 22px;
}

.secondary-btn {
    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    padding:
        10px 15px;

    border-radius: 9px;

    font-weight: 600;
}

.secondary-btn:hover {
    background:
        var(--surface-2);
}


/* =========================================================
   CATEGORY MODAL
========================================================= */

.category-input-row {
    display: flex;

    gap: 8px;
}

.category-input-row input {
    flex: 1;
}


/* =========================================================
   TOAST
========================================================= */

.toast-container {
    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 1000;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.toast {
    min-width: 250px;

    background:
        #111827;

    color: white;

    padding:
        13px 15px;

    border-radius: 10px;

    box-shadow:
        var(--shadow-lg);

    font-size: 13px;

    animation:
        toastIn .25s ease;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform:
            translateX(20px);
    }

    to {
        opacity: 1;
        transform:
            translateX(0);
    }
}


/* =========================================================
   MOBILE OVERLAY
========================================================= */

.mobile-overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    z-index: 80;

    display: none;
}

.mobile-overlay.show {
    display: block;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 1000px) {

    :root {
        --sidebar-width: 220px;
    }

    .header-left {
        width: 220px;
    }

    .header-right {
        width: 220px;
    }

    .bookmark-grid {
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(240px, 1fr)
            );
    }

}


@media(max-width: 800px) {

    :root {
        --header-height: 62px;
    }

    .header {
        padding:
            0 13px;
    }

    .header-left {
        width: auto;
    }

    .header-center {
        margin:
            0 10px;
    }

    .header-right {
        width: auto;
    }

    .brand-text {
        display: none;
    }

    .search-shortcut {
        display: none;
    }

    .sidebar {
        top: 0;

        width: 270px;

        padding-top: 75px;

        transform:
            translateX(-100%);

        box-shadow:
            10px 0 30px rgba(0,0,0,.1);
    }

    .sidebar.open {
        transform:
            translateX(0);
    }

    .main {
        margin-left: 0;

        padding-top:
            calc(var(--header-height) + 22px);
    }

    .content {
        padding:
            0 15px 40px;
    }

    .menu-btn {
        display: grid !important;
    }

}


@media(min-width: 801px) {

    .menu-btn {
        display: none !important;
    }

}


@media(max-width: 600px) {

    .page-header {
        align-items: flex-start;

        flex-direction: column;
    }

    .page-title {
        font-size: 23px;
    }

    .primary-btn {
        width: 100%;
    }

    .toolbar {
        align-items: stretch;

        flex-direction: column;
    }

    .filter-left {
        overflow-x: auto;

        padding-bottom: 2px;
    }

    .filter-right {
        justify-content: space-between;
    }

    .bookmark-grid {
        grid-template-columns: 1fr;

        gap: 12px;
    }

    .bookmark-card {
        min-height: 165px;
    }

    .header-center {
        display: none;
    }

    .header {
        justify-content: space-between;
    }

    .header-left {
        flex: 1;
    }

    .header-right {
        flex: 1;
    }

    .header-right {
        justify-content: flex-end;
    }

    .toast-container {
        left: 12px;
        right: 12px;
        bottom: 12px;
    }

    .toast {
        min-width: 0;
    }

}


@media(max-width: 380px) {

    .content {
        padding-left: 10px;
        padding-right: 10px;
    }

    .bookmark-card {
        padding: 14px;
    }

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 7px;
    height: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background:
        #cbd5e1;

    border-radius: 20px;
}

body.dark ::-webkit-scrollbar-thumb {
    background:
        #374151;
}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     HEADER
======================================================== -->

<header class="header">


    <div class="header-left">

        <button
            class="icon-btn menu-btn"
            onclick="toggleSidebar()"
            aria-label="Menu">

            ☰

        </button>


        <div class="brand">

            <div class="brand-icon">
                🔖
            </div>

            <div class="brand-text">
                Bookmark Hub
            </div>

        </div>

    </div>


    <div class="header-center">

        <div class="global-search">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search bookmarks..."
                autocomplete="off"
            >

            <span class="search-shortcut">
                Ctrl K
            </span>

        </div>

    </div>


    <div class="header-right">

        <button
            class="icon-btn"
            onclick="toggleDarkMode()"
            title="Toggle dark mode">

            🌙

        </button>


        <button
            class="icon-btn"
            onclick="openCategoryModal()"
            title="Manage categories">

            📁

        </button>


        <button
            class="icon-btn"
            onclick="openAddModal()"
            title="Add bookmark">

            ＋

        </button>

    </div>

</header>


<!-- =======================================================
     MOBILE OVERLAY
======================================================== -->

<div
    class="mobile-overlay"
    id="mobileOverlay"
    onclick="toggleSidebar()">
</div>


<!-- =======================================================
     SIDEBAR
======================================================== -->

<aside
    class="sidebar"
    id="sidebar">


    <div class="sidebar-section">

        <div class="sidebar-label">
            Library
        </div>


        <button
            class="nav-item active"
            data-category="All"
            onclick="selectCategory('All')">

            <div class="nav-item-left">

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    All Bookmarks
                </span>

            </div>

            <span
                class="nav-count"
                id="allCount">
                0
            </span>

        </button>


        <button
            class="nav-item"
            data-category="Favorites"
            onclick="selectCategory('Favorites')">

            <div class="nav-item-left">

                <span class="nav-icon">
                    ⭐
                </span>

                <span>
                    Favorites
                </span>

            </div>

            <span
                class="nav-count"
                id="favoriteCount">
                0
            </span>

        </button>

    </div>


    <div class="sidebar-section">

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const BOOKMARK_KEY =
    "professionalBookmarkHub";

const CATEGORY_KEY =
    "professionalBookmarkCategories";

const DARK_KEY =
    "professionalBookmarkDark";


/* =========================================================
   DEFAULT DATA
========================================================= */

const defaultCategories = [

    "General",
    "Finance",
    "Business",
    "Tools",
    "Education",
    "Work",
    "Social",
    "Entertainment"

];


const defaultBookmarks = [

    {
        id: Date.now(),
        name: "Google",
        url: "https://www.google.com",
        category: "General",
        description: "Google Search",
        favorite: true,
        created: Date.now()
    },

    {
        id: Date.now() + 1,
        name: "YouTube",
        url: "https://www.youtube.com",
        category: "Entertainment",
        description: "Watch videos and discover content.",
        favorite: false,
        created: Date.now() + 1
    },

    {
        id: Date.now() + 2,
        name: "TradingView",
        url: "https://www.tradingview.com",
        category: "Finance",
        description: "Charts, market analysis and trading tools.",
        favorite: false,
        created: Date.now() + 2
    }

];


/* =========================================================
   LOAD DATA
========================================================= */

let bookmarks =
    JSON.parse(
        localStorage.getItem(
            BOOKMARK_KEY
        )
    ) || defaultBookmarks;


let categories =
    JSON.parse(
        localStorage.getItem(
            CATEGORY_KEY
        )
    ) || defaultCategories;


let currentCategory =
    "All";


let currentFilter =
    "all";


let editingID =
    null;


/* =========================================================
   SAVE
========================================================= */

function saveData() {

    localStorage.setItem(
        BOOKMARK_KEY,
        JSON.stringify(bookmarks)
    );

    localStorage.setItem(
        CATEGORY_KEY,
        JSON.stringify(categories)
    );

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

    document
        .getElementById("mobileOverlay")
        .classList.toggle("show");

}


/* =========================================================
   CATEGORY SELECT
========================================================= */

function selectCategory(category) {

    currentCategory =
        category;

    currentFilter =
        "all";

    document
        .getElementById("allFilter")
        .classList.add("active");

    document
        .getElementById("favoriteFilter")
        .classList.remove("active");


    document
        .querySelectorAll(".nav-item[data-category]")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.category === category
            );

        });


    updatePageTitle();

    renderBookmarks();

    closeMobileSidebar();

}


function closeMobileSidebar() {

    if (
        window.innerWidth <= 800
    ) {

        document
            .getElementById("sidebar")
            .classList.remove("open");

        document
            .getElementById("mobileOverlay")
            .classList.remove("show");

    }

}


/* =========================================================
   PAGE TITLE
========================================================= */

function updatePageTitle() {

    const title =
        document.getElementById("pageTitle");

    const description =
        document.getElementById("pageDescription");


    if (currentCategory === "All") {

        title.textContent =
            "All Bookmarks";

        description.textContent =
            "Your saved websites in one place.";

    }

    else if (
        currentCategory === "Favorites"
    ) {

        title.textContent =
            "Favorites";

        description.textContent =
            "Your most important saved links.";

    }

    else {

        title.textContent =
            currentCategory;

        description.textContent =
            "Bookmarks in this category.";

    }

}


/* =========================================================
   RENDER CATEGORIES
========================================================= */

function renderCategories() {

    const list =
        document.getElementById(
            "categoryList"
        );

    list.innerHTML = "";


    categories.forEach(category => {

        const row =
            document.createElement("div");

        row.className =
            "category-row";


        const button =
            document.createElement("button");

        button.className =
            "nav-item " +
            (
                currentCategory === category
                    ? "active"
                    : ""
            );


        button.innerHTML = `

            <div class="nav-item-left">

                <span class="nav-icon">
                    📁
                </span>

                <span>
                    ${escapeHTML(category)}
                </span>

            </div>

            <span class="nav-count">
                ${
                    bookmarks.filter(
                        b =>
                            b.category === category
                    ).length
                }
            </span>

        `;


        button.onclick =
            () => selectCategory(category);


        row.appendChild(button);


        list.appendChild(row);

    });


    updateCounts();

    renderModalCategories();

}


/* =========================================================
   COUNTS
========================================================= */

function updateCounts() {

    document.getElementById(
        "allCount"
    ).textContent =
        bookmarks.length;


    document.getElementById(
        "favoriteCount"
    ).textContent =
        bookmarks.filter(
            b => b.favorite
        ).length;

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(filter) {

    currentFilter =
        filter;


    document
        .getElementById("allFilter")
        .classList.toggle(
            "active",
            filter === "all"
        );


    document
        .getElementById("favoriteFilter")
        .classList.toggle(
            "active",
            filter === "favorite"
        );


    renderBookmarks();

}


/* =========================================================
   RENDER BOOKMARKS
========================================================= */

function renderBookmarks() {

    const grid =
        document.getElementById(
            "bookmarkGrid"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );


    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    let list =
        [...bookmarks];


    /* CATEGORY */

    if (
        currentCategory !== "All" &&
        currentCategory !== "Favorites"
    ) {

        list =
            list.filter(
                b =>
                    b.category ===
                    currentCategory
            );

    }


    /* FAVORITES SIDEBAR */

    if (
        currentCategory === "Favorites"
    ) {

        list =
            list.filter(
                b => b.favorite
            );

    }


    /* FAVORITE FILTER */

    if (
        currentFilter === "favorite"
    ) {

        list =
            list.filter(
                b => b.favorite
            );

    }


    /* SEARCH */

    if (search) {

        list =
            list.filter(b => {

                const text =
                    (
                        b.name +
                        " " +
                        b.url +
                        " " +
                        b.category +
                        " " +
                        (b.description || "")
                    ).toLowerCase();


                return text.includes(search);

            });

    }


    /* SORT */

    const sort =
        document.getElementById(
            "sortSelect"
        ).value;


    if (sort === "newest") {

        list.sort(
            (a,b) =>
                b.created - a.created
        );

    }

    else if (sort === "oldest") {

        list.sort(
            (a,b) =>
                a.created - b.created
        );

    }

    else if (sort === "az") {

        list.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );

    }

    else if (sort === "za") {

        list.sort(
            (a,b) =>
                b.name.localeCompare(
                    a.name
                )
        );

    }

    else if (sort === "favorites") {

        list.sort(
            (a,b) =>
                Number(b.favorite) -
                Number(a.favorite)
        );

    }


    grid.innerHTML = "";


    if (list.length === 0) {

        grid.style.display =
            "none";

        empty.style.display =
            "block";

        return;

    }


    grid.style.display =
        "grid";

    empty.style.display =
        "none";


    list.forEach(bookmark => {

        grid.appendChild(
            createCard(bookmark)
        );

    });

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(bookmark) {

    const card =
        document.createElement("article");

    card.className =
        "bookmark-card";

    card.draggable =
        true;

    card.dataset.id =
        bookmark.id;


    const domain =
        getDomain(bookmark.url);


    card.innerHTML = `

        <div>

            <div class="card-head">

                <div class="site-icon">

                    <img
                        src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64"
                        alt=""
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='block';
                        "
                    >

                    <span
                        class="site-fallback"
                        style="display:none;">
                        🔗
                    </span>

                </div>


                <div class="card-info">

                    <div class="card-name">
                        ${escapeHTML(bookmark.name)}
                    </div>

                    <div class="card-url">
                        ${escapeHTML(domain)}
                    </div>

                </div>


                <button
                    class="star-btn ${
                        bookmark.favorite
                            ? "favorite"
                            : ""
                    }"
                    title="Favorite"
                    onclick="
                        event.stopPropagation();
                        toggleFavorite(${bookmark.id});
                    ">

                    ${
                        bookmark.favorite
                            ? "★"
                            : "☆"
                    }

                </button>

            </div>


            ${
                bookmark.description
                    ? `
                        <div class="card-description">
                            ${escapeHTML(
                                bookmark.description
                            )}
                        </div>
                    `
                    : ""
            }

        </div>


        <div class="card-footer">

            <span class="tag">
                📁 ${escapeHTML(bookmark.category)}
            </span>


            <div class="card-actions">

                <button
                    class="card-action"
                    title="Open"
                    onclick="
                        event.stopPropagation();
                        openBookmark('${encodeURIComponent(bookmark.url)}');
                    ">

                    ↗

                </button>


                <button
                    class="card-action"
                    title="Edit"
                    onclick="
                        event.stopPropagation();
                        editBookmark(${bookmark.id});
                    ">

                    ✏️

                </button>


                <button
                    class="card-action delete"
                    title="Delete"
                    onclick="
                        event.stopPropagation();
                        deleteBookmark(${bookmark.id});
                    ">

                    🗑

                </button>

            </div>

        </div>

    `;


    /* DRAG */

    card.addEventListener(
        "dragstart",
        () => {

            card.classList.add(
                "dragging"
            );

            draggedID =
                bookmark.id;

        }
    );


    card.addEventListener(
        "dragend",
        () => {

            card.classList.remove(
                "dragging"
            );

        }
    );


    card.addEventListener(
        "dragover",
        e => {

            e.preventDefault();

        }
    );


    card.addEventListener(
        "drop",
        e => {

            e.preventDefault();

            reorderBookmarks(
                bookmark.id
            );

        }
    );


    /* DOUBLE CLICK */

    card.addEventListener(
        "dblclick",
        () => {

            openBookmark(
                encodeURIComponent(
                    bookmark.url
                )
            );

        }
    );


    return card;

}


/* =========================================================
   DRAG REORDER
========================================================= */

let draggedID =
    null;


function reorderBookmarks(targetID) {

    if (
        draggedID === null ||
        draggedID === targetID
    ) {

        return;

    }


    const from =
        bookmarks.findIndex(
            b =>
                b.id === draggedID
        );


    const to =
        bookmarks.findIndex(
            b =>
                b.id === targetID
        );


    if (
        from === -1 ||
        to === -1
    ) {

        return;

    }


    const item =
        bookmarks.splice(
            from,
            1
        )[0];


    bookmarks.splice(
        to,
        0,
        item
    );


    saveData();

    renderBookmarks();

    showToast(
        "Bookmark order updated."
    );

}


/* =========================================================
   OPEN
========================================================= */

function openBookmark(encodedURL) {

    const url =
        decodeURIComponent(
            encodedURL
        );

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   ADD MODAL
========================================================= */

function openAddModal() {

    editingID =
        null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Bookmark";


    document.getElementById(
        "bookmarkName"
    ).value = "";


    document.getElementById(
        "bookmarkURL"
    ).value = "";


    document.getElementById(
        "bookmarkDescription"
    ).value = "";


    renderBookmarkCategorySelect();


    if (
        currentCategory !== "All" &&
        currentCategory !== "Favorites" &&
        categories.includes(
            currentCategory
        )
    ) {

        document.getElementById(
            "bookmarkCategory"
        ).value =
            currentCategory;

    }


    document.getElementById(
        "bookmarkModal"
    ).classList.add("show");


    setTimeout(
        () =>
            document.getElementById(
                "bookmarkName"
            ).focus(),
        100
    );

}


/* =========================================================
   EDIT
========================================================= */

function editBookmark(id) {

    const bookmark =
        bookmarks.find(
            b =>
                b.id === id
        );


    if (!bookmark) return;


    editingID =
        id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Bookmark";


    document.getElementById(
        "bookmarkName"
    ).value =
        bookmark.name;


    document.getElementById(
        "bookmarkURL"
    ).value =
        bookmark.url;


    document.getElementById(
        "bookmarkDescription"
    ).value =
        bookmark.description || "";


    renderBookmarkCategorySelect();


    document.getElementById(
        "bookmarkCategory"
    ).value =
        bookmark.category;


    document.getElementById(
        "bookmarkModal"
    ).classList.add("show");

}


/* =========================================================
   CATEGORY SELECT
========================================================= */

function renderBookmarkCategorySelect() {

    const select =
        document.getElementById(
            "bookmarkCategory"
        );


    select.innerHTML = "";


    categories.forEach(category => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            category;


        option.textContent =
            category;


        select.appendChild(
            option
        );

    });

}


/* =========================================================
   SAVE BOOKMARK
========================================================= */

function saveBookmark() {

    const name =
        document.getElementById(
            "bookmarkName"
        ).value.trim();


    let url =
        document.getElementById(
            "bookmarkURL"
        ).value.trim();


    const category =
        document.getElementById(
            "bookmarkCategory"
        ).value;


    const description =
        document.getElementById(
            "bookmarkDescription"
        ).value.trim();


    if (!name) {

        showToast(
            "Please enter a website name."
        );

        return;

    }


    if (!url) {

        showToast(
            "Please enter a website URL."
        );

        return;

    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        url =
            "https://" + url;

    }


    try {

        new URL(url);

    }

    catch {

        showToast(
            "Please enter a valid URL."
        );

        return;

    }


    /* EDIT */

    if (
        editingID !== null
    ) {

        const bookmark =
            bookmarks.find(
                b =>
                    b.id ===
                    editingID
            );


        if (bookmark) {

            bookmark.name =
                name;

            bookmark.url =
                url;

            bookmark.category =
                category;

            bookmark.description =
                description;

        }


        showToast(
            "Bookmark updated."
        );

    }


    /* NEW */

    else {

        bookmarks.unshift({

            id:
                Date.now(),

            name:
                name,

            url:
                url,

            category:
                category,

            description:
                description,

            favorite:
                false,

            created:
                Date.now()

        });


        showToast(
            "Bookmark added."
        );

    }


    saveData();

    closeModal();

    renderCategories();

    renderBookmarks();

}


/* =========================================================
   DELETE
========================================================= */

function deleteBookmark(id) {

    const bookmark =
        bookmarks.find(
            b =>
                b.id === id
        );


    if (!bookmark) return;


    const confirmed =
        confirm(
            `Delete "${bookmark.name}"?`
        );


    if (!confirmed) return;


    bookmarks =
        bookmarks.filter(
            b =>
                b.id !== id
        );


    saveData();

    renderCategories();

    renderBookmarks();


    showToast(
        "Bookmark deleted."
    );

}


/* =========================================================
   FAVORITE
========================================================= */

function toggleFavorite(id) {

    const bookmark =
        bookmarks.find(
            b =>
                b.id === id
        );


    if (!bookmark) return;


    bookmark.favorite =
        !bookmark.favorite;


    saveData();

    renderCategories();

    renderBookmarks();


    showToast(
        bookmark.favorite
            ? "Added to favorites."
            : "Removed from favorites."
    );

}


/* =========================================================
   CATEGORY MODAL
========================================================= */

function openCategoryModal() {

    renderModalCategories();


    document.getElementById(
        "categoryModal"
    ).classList.add("show");


    setTimeout(
        () =>
            document.getElementById(
                "newCategory"
            ).focus(),
        100
    );

}


function closeCategoryModal() {

    document.getElementById(
        "categoryModal"
    ).classList.remove("show");

}


function renderModalCategories() {

    const list =
        document.getElementById(
            "modalCategoryList"
        );


    if (!list) return;


    list.innerHTML = "";


    categories.forEach(category => {

        const row =
            document.createElement("div");


        row.style.cssText = `
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:11px 0;
            border-bottom:1px solid var(--border);
        `;


        row.innerHTML = `

            <span>
                📁 ${escapeHTML(category)}
            </span>

            <button
                class="card-action delete"
                title="Delete category"
                onclick="
                    deleteCategory('${encodeURIComponent(category)}')
                ">

                🗑

            </button>

        `;


        list.appendChild(row);

    });

}


/* =========================================================
   ADD CATEGORY
========================================================= */

function addCategory() {

    const input =
        document.getElementById(
            "newCategory"
        );


    const name =
        input.value.trim();


    if (!name) {

        showToast(
            "Enter a category name."
        );

        return;

    }


    const exists =
        categories.some(
            c =>
                c.toLowerCase() ===
                name.toLowerCase()
        );


    if (exists) {

        showToast(
            "Category already exists."
        );

        return;

    }


    categories.push(
        name
    );


    saveData();

    input.value = "";

    renderCategories();

    renderBookmarks();

    showToast(
        "Category created."
    );

}


/* =========================================================
   DELETE CATEGORY
========================================================= */

function deleteCategory(encodedCategory) {

    const category =
        decodeURIComponent(
            encodedCategory
        );


    if (
        categories.length <= 1
    ) {

        showToast(
            "You must keep at least one category."
        );

        return;

    }


    const count =
        bookmarks.filter(
            b =>
                b.category ===
                category
        ).length;


    const message =
        count > 0
            ? `${count} bookmark(s) will be moved to General. Continue?`
            : `Delete "${category}"?`;


    if (
        !confirm(message)
    ) {

        return;

    }


    bookmarks.forEach(
        b => {

            if (
                b.category ===
                category
            ) {

                b.category =
                    "General";

            }

        }
    );


    categories =
        categories.filter(
            c =>
                c !== category
        );


    if (
        currentCategory ===
        category
    ) {

        currentCategory =
            "All";

        updatePageTitle();

    }


    saveData();

    renderCategories();

    renderBookmarks();

    renderModalCategories();


    showToast(
        "Category deleted."
    );

}


/* =========================================================
   CLOSE BOOKMARK MODAL
========================================================= */

function closeModal() {

    document.getElementById(
        "bookmarkModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        DARK_KEY,
        dark
    );

}


/* =========================================================
   EXPORT
========================================================= */

function exportBookmarks() {

    const data = {

        version: 1,

        exportedAt:
            new Date().toISOString(),

        bookmarks:
            bookmarks,

        categories:
            categories

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "bookmark-hub-backup.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "Bookmarks exported."
    );

}


/* =========================================================
   IMPORT
========================================================= */

function importBookmarks(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !Array.isArray(
                        data.bookmarks
                    ) ||
                    !Array.isArray(
                        data.categories
                    )
                ) {

                    throw new Error(
                        "Invalid file"
                    );

                }


                if (
                    !confirm(
                        "Import will replace your current bookmark data. Continue?"
                    )
                ) {

                    return;

                }


                bookmarks =
                    data.bookmarks;


                categories =
                    data.categories;


                saveData();

                renderCategories();

                renderBookmarks();


                showToast(
                    "Bookmarks imported successfully."
                );

            }

            catch {

                showToast(
                    "Invalid bookmark backup file."
                );

            }

        };


    reader.readAsText(
        file
    );


    event.target.value =
        "";

}


/* =========================================================
   DOMAIN
========================================================= */

function getDomain(url) {

    try {

        return new URL(
            url
        ).hostname
            .replace(
                /^www\./,
                ""
            );

    }

    catch {

        return url;

    }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        2800
    );

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderBookmarks
    );


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            document
                .getElementById(
                    "searchInput"
                )
                .focus();

        }


        if (
            event.key === "Escape"
        ) {

            closeModal();

            closeCategoryModal();

        }

    }
);


/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

document
    .getElementById(
        "bookmarkModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );


document
    .getElementById(
        "categoryModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeCategoryModal();

            }

        }
    );


/* =========================================================
   ENTER = ADD CATEGORY
========================================================= */

document
    .getElementById(
        "newCategory"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addCategory();

            }

        }
    );


/* =========================================================
   LOAD DARK MODE
========================================================= */

if (
    localStorage.getItem(
        DARK_KEY
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderCategories();

updatePageTitle();

renderBookmarks();

</script>

</html>
